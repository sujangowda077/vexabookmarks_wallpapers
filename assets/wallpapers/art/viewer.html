<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vexa Ultra-HD Art Viewer</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #020408;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #art-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
      transition: opacity 0.35s cubic-bezier(0.16, 1, 0.3, 1), transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      opacity: 0;
      transform: scale(1.02);
    }
    #art-img.loaded {
      opacity: 1;
      transform: scale(1);
    }
    .art-vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle at center, transparent 45%, rgba(2, 4, 8, 0.4) 100%);
    }
  </style>
</head>
<body>
  <img id="art-img" alt="Vexa Ultra-HD Wallpaper">
  <div class="art-vignette"></div>
  <script src="viewer.js"></script>
</body>
</html>
